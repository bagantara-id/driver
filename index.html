<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAGANTARA | Driver</title>
    
    <!-- Peta OSM (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- ======================================================== -->
    <!-- STATE 1: GERBANG OTORISASI (LOGIN)                       -->
    <!-- ======================================================== -->
    <div id="state-login" class="w-full max-w-sm flex flex-col items-center justify-center z-10 transition-opacity duration-500">
        <div class="kotak-kunci w-full text-center">
            <div style="margin-bottom: 25px;">
                <!-- Gear Icon Authentication -->
                <div id="btn-auth" class="relative w-28 h-28 mx-auto cursor-pointer flex items-center justify-center rounded-full mb-4">
                    <svg class="gear-auth w-full h-full text-[var(--neon-gold)]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                    </svg>
                    <div class="absolute w-6 h-6 bg-[var(--bg-base)] rounded-full border-2 border-[var(--neon-gold)] shadow-[0_0_10px_var(--neon-gold)]"></div>
                </div>
                <h2 class="font-tech font-bold text-[var(--text-main)] text-xl tracking-[0.15em] mb-1">SECURE PORTAL</h2>
                <span class="font-tech text-[var(--text-muted)] text-[0.7rem] uppercase tracking-widest">Sistem Terenkripsi. Ketuk Roda Untuk Otorisasi.</span>
            </div>
            <button type="button" id="btnGoogleLogin" class="btn-cyber font-tech mt-2" style="background: rgba(234, 67, 53, 0.05); border-color: #ea4335; color: #ea4335;">
                <i class="fa-brands fa-google"></i> OTORISASI GOOGLE
            </button>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- STATE 2: REGISTRASI & PENDING (MEMBEKU)                  -->
    <!-- ======================================================== -->
    <div id="state-registration" class="hidden-state w-full max-w-md flex flex-col z-20">
        <div class="hologram-panel p-6">
            <h2 class="text-lg font-tech font-bold text-[var(--neon-gold)] mb-3 border-b border-[var(--border-cyber)] pb-2 tracking-widest"><i class="fa-solid fa-id-card"></i> KREDENSIAL</h2>
            
            <div id="reg-status-alert" class="mb-4 p-3 rounded-lg text-[0.75rem] font-tech tracking-wide border text-center"></div>

            <div class="space-y-1">
                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="reg-email" class="input-cyber font-tech" disabled>
                </div>
                
                <!-- Kategori Armada Kunci Layanan -->
                <div class="input-group">
                    <i class="fa-solid fa-motorcycle input-icon"></i>
                    <select id="reg-kategori" class="input-cyber font-tech font-bold text-[var(--neon-gold)]" style="appearance: none; background-color: var(--bg-card);">
                        <option value="Motor" class="bg-[var(--bg-panel-solid)] text-[var(--text-main)]">ARMADA: MOTOR</option>
                        <option value="Mobil" class="bg-[var(--bg-panel-solid)] text-[var(--text-main)]">ARMADA: MOBIL</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-user-tie input-icon"></i>
                    <input type="text" id="reg-nama" class="input-cyber font-tech" placeholder="Nama Lengkap">
                </div>
                <div class="flex gap-3">
                    <div class="input-group w-1/2">
                        <i class="fa-solid fa-hashtag input-icon"></i>
                        <input type="text" id="reg-plat" class="input-cyber font-tech uppercase" placeholder="B 1234 CD">
                    </div>
                    <div class="input-group w-1/2">
                        <i class="fa-brands fa-whatsapp input-icon"></i>
                        <input type="number" id="reg-wa" class="input-cyber font-tech" placeholder="628...">
                    </div>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-car input-icon"></i>
                    <input type="text" id="reg-kendaraan" class="input-cyber font-tech" placeholder="Merek & Tipe (Cth: Vario)">
                </div>
                
                <button id="btn-submit-reg" class="btn-cyber font-tech w-full mt-2">
                    <i class="fa-solid fa-lock"></i> KIRIM & KUNCI DATA
                </button>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- STATE 3: DASHBOARD EXECUTIVE (TIGA TAB & PETA)           -->
    <!-- ======================================================== -->
    <div id="state-dashboard" class="hidden-state w-full h-[100dvh] flex flex-col z-20">
        
        <!-- HEADER UTAMA -->
        <div class="hologram-panel mx-4 mt-4 p-4 flex justify-between items-center border-t-4 border-t-[var(--neon-gold)] shrink-0">
            <div>
                <h2 class="text-base font-tech font-bold text-[var(--neon-gold)] tracking-widest"><i class="fa-solid fa-satellite-dish mr-1"></i> RADAR SISTEM</h2>
                <span id="status-text" class="text-[0.65rem] font-tech text-[var(--text-muted)] uppercase tracking-widest block mt-1">Terputus (Offline)</span>
            </div>
            <!-- Tombol Master Online/Offline -->
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="toggle-online" class="sr-only peer">
                <div class="w-12 h-6 bg-[var(--bg-card)] border border-[var(--border-cyber)] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-[var(--text-muted)] after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[var(--success)] peer-checked:after:bg-white shadow-inner"></div>
            </label>
        </div>
        
        <!-- KONTAINER TAB BERGULIR -->
        <div class="flex-1 overflow-y-auto p-4 pb-24 relative" id="tab-container">
            
            <!-- TAB 1: RADAR (PETA) -->
            <div id="tab-radar" class="tab-content flex flex-col h-full gap-3">
                <div class="hologram-panel p-3 flex justify-between items-center bg-[var(--bg-panel-solid)]">
                    <span class="text-[10px] text-[var(--text-muted)] font-tech uppercase font-bold tracking-widest"><i class="fa-solid fa-network-wired mr-1"></i> Transmisi</span>
                    <select id="radar-mode" class="input-cyber font-tech text-[10px] !py-1.5 !px-3 w-auto bg-[var(--bg-panel-solid)] font-bold text-[var(--neon-gold)]" style="appearance: none; text-align: center;">
                        <option value="dinamis">DINAMIS (OTOMATIS)</option>
                        <option value="jaring">MANGKAL (MANUAL)</option>
                    </select>
                </div>
                
                <!-- Timer Durasi (Hanya muncul jika mode Jaring) -->
                <div id="mangkal-timer-container" class="hidden-state hologram-panel p-3 flex justify-between items-center border border-blue-500/30" style="background: rgba(59,130,246,0.05);">
                     <span class="text-[10px] text-blue-400 font-tech uppercase font-bold tracking-widest"><i class="fa-solid fa-stopwatch mr-1"></i> Kedaluwarsa</span>
                     <select id="mangkal-durasi" class="input-cyber font-tech text-[10px] !py-1.5 !px-3 w-auto bg-[var(--bg-panel-solid)] font-bold text-blue-400" style="appearance: none; text-align: center;">
                        <option value="1">1 JAM</option>
                        <option value="6">6 JAM</option>
                        <option value="12">12 JAM</option>
                    </select>
                </div>

                <!-- Kontainer OSM Map -->
                <div class="hologram-panel flex-1 min-h-[400px] relative rounded-xl overflow-hidden border-2 border-[var(--border-cyber)]">
                    <div id="map" class="absolute inset-0 bg-[var(--bg-card)] z-10"></div>
                </div>
            </div>

            <!-- TAB 2: OPERASIONAL -->
            <div id="tab-ops" class="tab-content hidden-state flex flex-col gap-4">
                <div class="hologram-panel p-5">
                    <h3 class="text-[0.75rem] font-tech font-bold text-[var(--text-main)] uppercase tracking-widest mb-4 flex items-center gap-2 border-b border-[var(--border-cyber)] pb-2">
                        <i class="fa-solid fa-sliders text-[var(--success)]"></i> KONTROL LAYANAN
                    </h3>
                    <div class="space-y-3">
                        <div class="input-group mb-2">
                            <i class="fa-solid fa-bullhorn input-icon"></i>
                            <input type="text" id="dash-info" class="input-cyber font-tech text-sm" placeholder="Papan Info (Opsional)">
                        </div>
                        
                        <!-- Logika Layanan Multi-Pilih -->
                        <div class="border border-[var(--border-cyber)] rounded-lg p-3 bg-[var(--bg-card)] mb-2">
                            <span class="text-[10px] text-[var(--text-muted)] font-tech uppercase font-bold mb-3 block border-b border-gray-600/30 pb-2">Layanan Aktif (Pilih Minimal 1)</span>
                            <div id="layanan-options-container" class="flex flex-col gap-3">
                                <!-- Checkbox dirender dinamis via JS bergantung tipe armada (Motor/Mobil) -->
                            </div>
                        </div>

                        <div class="flex gap-3">
                            <div class="input-group w-1/2 mb-0">
                                <i class="fa-solid fa-coins input-icon"></i>
                                <input type="number" id="dash-tarif" class="input-cyber font-tech text-sm" placeholder="Tarif Min (Rp)">
                            </div>
                            <div class="input-group w-1/2 mb-0">
                                <i class="fa-solid fa-route input-icon"></i>
                                <input type="number" id="dash-radius" class="input-cyber font-tech text-sm" placeholder="Maks (Km)">
                            </div>
                        </div>
                        <button id="btn-save-settings" class="btn-cyber font-tech w-full mt-2">
                            <i class="fa-solid fa-floppy-disk"></i> SIMPAN OPERASIONAL
                        </button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: PROFIL -->
            <div id="tab-profil" class="tab-content hidden-state flex flex-col gap-4">
                <div class="hologram-panel p-5 flex flex-col items-center">
                    <img id="profile-photo-preview" src="https://ui-avatars.com/api/?name=Driver&background=c5a880&color=fff" class="w-24 h-24 rounded-full border-4 border-[var(--neon-gold)] object-cover mb-2" alt="Foto Driver">
                    <span class="text-[10px] font-tech text-[var(--text-muted)] tracking-widest uppercase"><i class="fa-solid fa-shield-halved text-[var(--neon-gold)] mr-1"></i> Foto Diverifikasi Admin</span>
                </div>

                <div class="hologram-panel p-5 bg-[rgba(0,0,0,0.2)]">
                    <h3 class="text-[0.75rem] font-tech font-bold text-[var(--text-muted)] uppercase tracking-widest mb-4 flex items-center gap-2 border-b border-[var(--border-cyber)] pb-2">
                        <i class="fa-solid fa-shield-halved text-[var(--danger)]"></i> DATA TERKUNCI ADMIN
                    </h3>
                    <div class="space-y-1">
                        <div class="input-group">
                            <i class="fa-solid fa-user-lock input-icon text-[var(--text-muted)]"></i>
                            <input type="text" id="lock-nama" class="input-cyber font-tech text-sm" disabled>
                        </div>
                        <div class="input-group">
                            <i class="fa-solid fa-car input-icon text-[var(--text-muted)]"></i>
                            <input type="text" id="lock-kendaraan" class="input-cyber font-tech text-sm" disabled>
                        </div>
                        <div class="flex gap-3">
                            <div class="input-group w-1/2">
                                <i class="fa-solid fa-hashtag input-icon text-[var(--text-muted)]"></i>
                                <input type="text" id="lock-plat" class="input-cyber font-tech text-sm uppercase" disabled>
                            </div>
                            <div class="input-group w-1/2">
                                <i class="fa-brands fa-whatsapp input-icon text-[var(--text-muted)]"></i>
                                <input type="text" id="lock-wa" class="input-cyber font-tech text-sm" disabled>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 mt-2">
                    <button id="btnThemeToggle" class="btn-cyber flex-1 !border-[var(--text-muted)] !text-[var(--text-muted)] !bg-[rgba(255,255,255,0.05)]">
                        <i class="fa-solid fa-moon" id="iconTheme"></i> TEMA
                    </button>
                    <button class="btn-cyber flex-1 btn-logout !border-[var(--danger)] !text-[var(--danger)] !bg-[rgba(239,68,68,0.05)]">
                        <i class="fa-solid fa-power-off"></i> KELUAR
                    </button>
                </div>
            </div>
        </div>

        <!-- NAVIGASI BAWAH (BOTTOM NAV) -->
        <div class="fixed bottom-0 left-0 right-0 bg-[var(--bg-panel-solid)] border-t border-[var(--border-cyber)] flex justify-around p-3 z-50">
            <button class="nav-btn active flex flex-col items-center gap-1 text-[var(--neon-gold)] transition-colors" data-target="tab-radar">
                <i class="fa-solid fa-location-crosshairs text-xl"></i>
                <span class="text-[9px] font-tech font-bold uppercase tracking-widest">Radar</span>
            </button>
            <button class="nav-btn flex flex-col items-center gap-1 text-[var(--text-muted)] transition-colors" data-target="tab-ops">
                <i class="fa-solid fa-sliders text-xl"></i>
                <span class="text-[9px] font-tech font-bold uppercase tracking-widest">Operasi</span>
            </button>
            <button class="nav-btn flex flex-col items-center gap-1 text-[var(--text-muted)] transition-colors" data-target="tab-profil">
                <i class="fa-solid fa-user-astronaut text-xl"></i>
                <span class="text-[9px] font-tech font-bold uppercase tracking-widest">Profil</span>
            </button>
        </div>
    </div>

    <!-- SISTEM CUSTOM MODAL (PENGGANTI ALERT) -->
    <div id="cyber-modal" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 backdrop-blur-sm hidden-state opacity-0 transition-opacity duration-300">
        <div class="hologram-panel max-w-xs w-full mx-4 p-6 text-center scale-95 transition-transform duration-300" id="cyber-modal-box">
            <div id="cyber-modal-icon" class="text-4xl mb-3 text-[var(--neon-gold)]"><i class="fa-solid fa-circle-exclamation"></i></div>
            <h3 id="cyber-modal-title" class="font-tech font-bold text-lg mb-2 text-white tracking-widest uppercase">Pemberitahuan</h3>
            <p id="cyber-modal-msg" class="font-tech text-sm text-[var(--text-muted)] mb-5 leading-relaxed"></p>
            <button id="btn-close-modal" class="btn-cyber font-tech w-full">MENGERTI</button>
        </div>
    </div>

    <!-- Tautkan File Script Tahap Selanjutnya -->
    <script type="module" src="js/firebase-config.js?v=2"></script>
    <script type="module" src="js/auth.js?v=2"></script>
    <script type="module" src="js/dashboard.js?v=2"></script>
    <script type="module" src="js/gps-engine.js?v=2"></script>
    
</body>
</html>
